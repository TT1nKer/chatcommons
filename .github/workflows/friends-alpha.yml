name: Friends alpha

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install desktop build libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libwayland-dev libxkbcommon-dev libx11-dev
      - run: cargo fmt --all -- --check
      - run: cargo build --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --all-targets
      - name: Check prototype localization and feedback
        run: python3 -m unittest discover -s apps/review-prototype -p 'test_*.py'
      - name: Check text persistence with a legacy console encoding
        env:
          PYTHONIOENCODING: cp1252
        run: python3 scripts/release-smoke.py target/debug/chatcommons-node

  macos:
    needs: verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release -p chatcommons-cli --bin chatcommons-node
      - run: cargo build --locked --release -p chatcommons-desktop --bin chatcommons-desktop
      - name: Check macOS architecture and packaged node
        run: |
          test "$(uname -m)" = arm64
          python3 scripts/release-smoke.py target/release/chatcommons-node
      - name: Package application bundle
        run: |
          set -eu
          app="dist/ChatCommons Alpha.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/chatcommons-desktop "$app/Contents/MacOS/"
          cp target/release/chatcommons-node "$app/Contents/MacOS/"
          cp apps/desktop/packaging/Info.plist "$app/Contents/"
          cp README.md "$app/Contents/Resources/README.md"
          cp apps/desktop/README.md "$app/Contents/Resources/DESKTOP.md"
          cp LICENSE VERSION "$app/Contents/Resources/"
          codesign --force --deep --sign - "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" ChatCommons-alpha-macOS-arm64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ChatCommons-alpha-macOS-arm64
          path: ChatCommons-alpha-macOS-arm64.zip
          if-no-files-found: error

  windows:
    needs: verify
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release -p chatcommons-cli --bin chatcommons-node
      - run: cargo build --locked --release -p chatcommons-desktop --bin chatcommons-desktop
      - name: Check packaged Windows node
        run: python scripts/release-smoke.py target/release/chatcommons-node.exe
      - name: Package Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/ChatCommons-alpha | Out-Null
          Copy-Item target/release/chatcommons-desktop.exe dist/ChatCommons-alpha/ChatCommons.exe
          Copy-Item target/release/chatcommons-node.exe dist/ChatCommons-alpha/chatcommons-node.exe
          Copy-Item README.md dist/ChatCommons-alpha/README.md
          Copy-Item apps/desktop/README.md dist/ChatCommons-alpha/DESKTOP.md
          Copy-Item LICENSE,VERSION dist/ChatCommons-alpha/
          Compress-Archive -Path dist/ChatCommons-alpha -DestinationPath ChatCommons-alpha-Windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ChatCommons-alpha-Windows-x64
          path: ChatCommons-alpha-Windows-x64.zip
          if-no-files-found: error

  linux-server:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release -p chatcommons-cli --bin chatcommons-node
      - name: Check packaged Linux node
        run: python3 scripts/release-smoke.py target/release/chatcommons-node
      - name: Package Home Server binary
        run: |
          set -eu
          mkdir -p dist/ChatCommons-alpha-Linux-x64
          cp target/release/chatcommons-node dist/ChatCommons-alpha-Linux-x64/
          cp README.md dist/ChatCommons-alpha-Linux-x64/README.md
          cp deploy/README.md dist/ChatCommons-alpha-Linux-x64/SERVER.md
          cp LICENSE VERSION dist/ChatCommons-alpha-Linux-x64/
          tar -C dist -czf ChatCommons-alpha-Linux-x64.tar.gz ChatCommons-alpha-Linux-x64
      - uses: actions/upload-artifact@v7
        with:
          name: ChatCommons-alpha-Linux-x64
          path: ChatCommons-alpha-Linux-x64.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows, linux-server]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: ChatCommons-alpha-*
          path: dist
          merge-multiple: true
      - name: Create prerelease with checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
          (cd dist && sha256sum *.zip *.tar.gz > SHA256SUMS.txt)
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --title "ChatCommons ${GITHUB_REF_NAME}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md" \
            --prerelease
