# Copy to /etc/livekit/livekit.yaml as root:livekit mode 0640.
# Replace both credentials with independently generated random values.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50020
  use_external_ip: true
room:
  max_participants: 10
turn:
  enabled: true
  domain: turn.ttinker.net
  udp_port: 443
  tls_port: 5349
  relay_range_start: 40000
  relay_range_end: 40100
  cert_file: /etc/livekit/tls/fullchain.pem
  key_file: /etc/livekit/tls/privkey.pem
keys:
  replace-api-key: replace-with-at-least-32-random-characters
